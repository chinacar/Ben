<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AutoChina Export</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
        body{background:#f4f7fc;padding:20px}
        .container{max-width:1300px;margin:0 auto;background:#fff;border-radius:28px;padding:20px 24px 40px}
        .lang-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:20px;border-bottom:1px solid #e2e8f0;padding-bottom:12px;flex-wrap:nowrap}
        .lang-btn{background:#fff;border:1px solid #cbd5e1;padding:6px 12px;border-radius:40px;cursor:pointer;font-size:0.85rem;white-space:nowrap}
        .lang-btn.active{background:#1e4a76;color:#fff;border-color:#1e4a76}
        @media (max-width: 550px){.lang-bar{gap:5px;justify-content:center}.lang-btn{padding:5px 10px;font-size:0.75rem}.container{padding:15px}}
        .filter-section{background:#f8fafc;border-radius:24px;padding:18px 20px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:15px;align-items:flex-end}
        .filter-group{flex:1 1 150px;min-width:120px}
        .filter-group label{font-size:0.7rem;text-transform:uppercase;font-weight:600;color:#4a5b6e;display:block;margin-bottom:5px}
        .filter-group select{width:100%;padding:10px;border-radius:16px;border:1px solid #cbd5e1;background:#fff}
        .reset-btn{background:#eef2f6;border:none;padding:10px 20px;border-radius:30px;cursor:pointer;margin-top:22px}
        .update-date{text-align:right;font-size:0.75rem;color:#6c757d;margin-bottom:20px;padding-right:4px}
        .cars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px;margin:25px 0}
        .car-card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,0.05);cursor:pointer;border:1px solid #eef2f8}
        .car-card:hover{transform:translateY(-4px)}
        .car-image-area{height:180px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:2rem}
        .car-image-area img{width:100%;height:100%;object-fit:cover}
        .car-info{padding:18px}
        .car-title{font-size:1.2rem;font-weight:700;margin-bottom:8px;white-space:normal;word-break:break-word;line-height:1.3}
        .car-price{font-weight:800;color:#0f3b5c;font-size:1.1rem;margin-top:8px}
        .badge{background:#eef2ff;padding:4px 10px;border-radius:20px;font-size:0.7rem}
        .home-contact{background:#f8fafc;border-radius:24px;padding:16px 20px;margin-top:20px;text-align:center}
        .home-contact-title{font-size:0.9rem;font-weight:600;color:#4a5b6e;margin-bottom:12px}
        .home-contact-buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
        .home-contact-btn{flex:0 1 auto;padding:8px 16px;border-radius:40px;text-decoration:none;font-size:0.85rem;display:inline-flex;align-items:center;gap:8px}
        .home-mail{background:#e0f2fe;color:#0369a1}
        .home-tel{background:#fff1f0;color:#b91c1c}
        .home-wa{background:#dcfce7;color:#15803d}
        .home-wechat{background:#e0e7ff;color:#1e3a8a}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000}
        .modal-content{background:#fff;max-width:600px;width:90%;border-radius:28px;padding:20px;position:relative;max-height:90vh;overflow-y:auto}
        .close-modal{position:absolute;top:12px;right:18px;font-size:28px;cursor:pointer}
        .swiper{width:100%;height:300px;border-radius:16px;margin-bottom:16px}
        .swiper-slide img{width:100%;height:100%;object-fit:contain;background:#f1f5f9}
        .detail-field{margin:12px 0;border-bottom:1px solid #e2e8f0;padding-bottom:6px}
        .contact-buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
        .contact-btn{flex:1;text-align:center;padding:10px;border-radius:40px;text-decoration:none;font-size:0.8rem;background:#f1f5f9;color:#1e293b;cursor:pointer;border:none}
        .contact-mail{background:#e0f2fe;color:#0369a1}
        .contact-wa{background:#dcfce7;color:#15803d}
        .contact-wechat{background:#e0e7ff;color:#1e3a8a}
        .contact-tel{background:#fff1f0;color:#b91c1c}
        .loading-spinner{text-align:center;padding:50px;color:#5b6e8c}
        .no-results{text-align:center;padding:50px;color:#5b6e8c}
        @media (max-width:650px){.cars-grid{grid-template-columns:1fr}.swiper{height:220px}}
    </style>
</head>
<body>
<div class="container">
    <div class="lang-bar">
        <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
        <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn" data-lang="fr">🇫🇷 Français</button>
        <button class="lang-btn" data-lang="ar">🇸🇦 العربية</button>
    </div>
    <div class="filter-section">
        <div class="filter-group"><label id="label-brand">品牌</label><select id="filterBrand"></select></div>
        <div class="filter-group"><label id="label-price">价格 (USD)</label><select id="filterPrice"><option value="all">全部</option><option value="0-5000">$0-$5k</option><option value="5000-10000">$5k-$10k</option><option value="10000-20000">$10k-$20k</option><option value="20000-50000">$20k-$50k</option><option value="50000-9999999">$50k+</option></select></div>
        <div class="filter-group"><label id="label-mileage">公里数</label><select id="filterMileage"><option value="all">全部</option><option value="0-10000">0-1万km</option><option value="10000-30000">1万-3万km</option><option value="30000-60000">3万-6万km</option><option value="60000-999999">6万+ km</option></select></div>
        <div class="filter-group"><label id="label-energy">动力类型</label><select id="filterEnergy"></select></div>
        <div><button class="reset-btn" id="resetFilters">⟳ 重置</button></div>
    </div>
    <div class="update-date" id="updateDate"></div>
    <div id="carsGrid" class="cars-grid"><div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> 加载车源中...</div></div>
    <div class="home-contact" id="homeContact">
        <div class="home-contact-title" id="contactTitle">📞 联系我们</div>
        <div class="home-contact-buttons" id="homeContactButtons"></div>
    </div>
</div>
<div id="detailModal" class="modal"><div class="modal-content"><span class="close-modal">&times;</span><div class="swiper" id="detailSwiper"><div class="swiper-wrapper" id="swiperWrapper"></div><div class="swiper-button-next"></div><div class="swiper-button-prev"></div></div><h2 id="modalTitle"></h2><div id="modalDetails"></div><div class="contact-buttons" id="contactButtons"></div></div></div>
<script>
const EXCEL_URL = "https://raw.githubusercontent.com/chinacar/Ben/main/cars.xlsx";
const CONTACT = { email: "shengunju@gmail.com", phone: "+8615589681341", whatsapp: "19059231202", wechat: "AutoChinaExport" };
const USD_RATE = 6.75;

let currentLang = "zh";
let allCars = [];
let currentFilter = { brand: "all", priceRange: "all", mileageRange: "all", energyType: "all" };
let swiperInstance = null;
let dataLoaded = false;

let translationCache = {};

function getYesterdayDate(lang) {
    const today = new Date();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const day = yesterday.getDate();
    const year = yesterday.getFullYear();
    if (lang === 'en') {
        const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${monthNames[yesterday.getMonth()]} ${day}, ${year}`;
    } else if (lang === 'fr') {
        const monthNames = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
        return `${day} ${monthNames[yesterday.getMonth()]} ${year}`;
    } else if (lang === 'ar') {
        const monthNames = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        return `${day} ${monthNames[yesterday.getMonth()]} ${year}`;
    } else {
        return `${year}年${yesterday.getMonth()+1}月${day}日`;
    }
}

async function translateText(text, targetLang) {
    if (!text || text === "-") return text;
    if (targetLang === "zh") return text;
    const cacheKey = `${text}_${targetLang}`;
    if (translationCache[cacheKey]) return translationCache[cacheKey];
    try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        const translated = data[0][0][0];
        translationCache[cacheKey] = translated;
        return translated;
    } catch (error) {
        console.warn(`翻译失败: ${text}`, error);
        return text;
    }
}

async function translateBatch(items, targetLang) {
    if (targetLang === "zh") return items.reduce((obj, item) => { obj[item] = item; return obj; }, {});
    const results = {};
    // 分批翻译，每批5个，避免手机浏览器并发限制
    const batchSize = 5;
    for (let i = 0; i < items.length; i += batchSize) {
        const batch = items.slice(i, i + batchSize);
        const promises = batch.map(async (item) => {
            if (!item || item === "-") { results[item] = item; return; }
            results[item] = await translateText(item, targetLang);
        });
        await Promise.all(promises);
    }
    return results;
}

async function loadData() {
    try {
        const res = await fetch(EXCEL_URL);
        const ab = await res.arrayBuffer();
        const wb = XLSX.read(ab);
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });
        if(rows.length<2) throw new Error("无数据");
        const headers = rows[0].map(h=>String(h||"").trim());
        allCars = [];
        for(let i=1;i<rows.length;i++){
            const row = rows[i];
            const get = (n)=>{ let idx=headers.indexOf(n); return idx>=0 ? (row[idx]||"").toString().trim() : ""; };
            const brand = get("品牌");
            const model = get("产品型号");
            if(!brand || !model) continue;
            const imgs = [];
            for(let j=1;j<=10;j++){ let u = get(`图片${j}`); if(u.startsWith("http")) imgs.push(u); }
            let exwCNY = parseFloat(get("EXW"));
            let fobCNY = parseFloat(get("FOB"));
            let exwUSD = !isNaN(exwCNY) ? Math.round(exwCNY / USD_RATE) : null;
            let fobUSD = !isNaN(fobCNY) ? Math.round(fobCNY / USD_RATE) : null;
            allCars.push({
                id:i, brandCh:brand, energyCh:get("类型")||"汽油", model:model, config:get("配置类别")||"", 
                colorCh:get("颜色")||"-", km:parseFloat(get("公里数"))||0, exwUSD, fobUSD, imgs
            });
        }
        if(!allCars.length) throw new Error("无有效车辆");
        dataLoaded = true;
        renderUI_ZH();
    } catch(e) { 
        document.getElementById("carsGrid").innerHTML = `<div class="no-results">⚠️ 加载失败: ${e.message}</div>`; 
    }
}

function renderUI_ZH() {
    const t = {
        brand:"品牌", price:"价格 (USD)", mileage:"公里数", energy:"动力类型", reset:"重置",
        noCars:"没有找到符合条件的车辆", all:"全部", email:"邮箱", phone:"电话", contactUs:"📞 联系我们",
        updatePrefix:"数据更新于", color:"颜色", exw:"EXW", fob:"FOB", wechat:"微信", noImage:"暂无图片"
    };
    document.title = "AutoChina Export";
    document.getElementById("label-brand").innerText = t.brand;
    document.getElementById("label-price").innerText = t.price;
    document.getElementById("label-mileage").innerText = t.mileage;
    document.getElementById("label-energy").innerText = t.energy;
    document.getElementById("resetFilters").innerText = t.reset;
    document.getElementById("filterPrice").options[0].text = t.all;
    document.getElementById("filterMileage").options[0].text = t.all;
    
    const energySelect = document.getElementById("filterEnergy");
    energySelect.innerHTML = `<option value="all">${t.all}</option>
        <option value="汽油">汽油</option><option value="柴油">柴油</option>
        <option value="电动">电动</option><option value="混动">混动</option>`;
    if (currentFilter.energyType !== "all") energySelect.value = currentFilter.energyType;
    
    const brands = [...new Set(allCars.map(c => c.brandCh))];
    const brandSelect = document.getElementById("filterBrand");
    let opts = `<option value="all">${t.all}</option>`;
    brands.forEach(b => { opts += `<option value="${b}">${b}</option>`; });
    brandSelect.innerHTML = opts;
    if (currentFilter.brand !== "all") brandSelect.value = currentFilter.brand;
    
    document.getElementById("contactTitle").innerText = t.contactUs;
    document.getElementById("homeContactButtons").innerHTML = `
        <a href="mailto:${CONTACT.email}" class="home-contact-btn home-mail"><i class="fas fa-envelope"></i> ${t.email}</a>
        <a href="tel:${CONTACT.phone}" class="home-contact-btn home-tel"><i class="fas fa-phone-alt"></i> ${t.phone}</a>
        <a href="https://wa.me/${CONTACT.whatsapp}" target="_blank" class="home-contact-btn home-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <button class="home-contact-btn home-wechat" id="homeWechatBtn"><i class="fab fa-weixin"></i> ${t.wechat}: ${CONTACT.wechat}</button>
    `;
    document.getElementById("homeWechatBtn")?.addEventListener('click', () => {
        navigator.clipboard.writeText(CONTACT.wechat);
        alert(`${t.wechat}: ${CONTACT.wechat} 已复制`);
    });
    
    document.getElementById("updateDate").innerText = `${t.updatePrefix} ${getYesterdayDate("zh")}`;
    renderCars_ZH();
}

function renderCars_ZH() {
    let filtered = allCars.filter(c=>{
        if(currentFilter.brand!=="all" && c.brandCh!==currentFilter.brand) return false;
        let price = (c.exwUSD!==null?c.exwUSD:(c.fobUSD!==null?c.fobUSD:0));
        if(currentFilter.priceRange!=="all"){ let [min,max]=currentFilter.priceRange.split("-").map(Number); if(price<min||price>max) return false; }
        if(currentFilter.mileageRange!=="all"){ let [min,max]=currentFilter.mileageRange.split("-").map(Number); if(c.km<min||c.km>max) return false; }
        if(currentFilter.energyType!=="all" && c.energyCh!==currentFilter.energyType) return false;
        return true;
    });
    const grid = document.getElementById("carsGrid");
    if(!filtered.length){ grid.innerHTML = `<div class="no-results">没有找到符合条件的车辆</div>`; return; }
    grid.innerHTML = filtered.map(c=>{
        let price = c.exwUSD!==null ? `${c.exwUSD.toLocaleString()} $` : (c.fobUSD!==null ? `${c.fobUSD.toLocaleString()} $` : "联系询价");
        return `<div class="car-card" data-id="${c.id}">
            <div class="car-image-area">${c.imgs[0]?`<img src="${c.imgs[0]}" onerror="this.parentElement.innerHTML='<i class=\'fas fa-car\'></i>'">`:'<i class="fas fa-car"></i>'}</div>
            <div class="car-info">
                <div class="car-title">${c.brandCh} ${c.model} ${c.config}</div>
                <div><span class="badge">${c.energyCh}</span> <span>${c.km.toLocaleString()} km</span></div>
                <div class="car-price">💰 ${price}</div>
                <div>🎨 ${c.colorCh === "-" ? "-" : c.colorCh}</div>
            </div>
        </div>`;
    }).join('');
    document.querySelectorAll('.car-card').forEach(card=>card.addEventListener('click',()=>showDetail_ZH(parseInt(card.dataset.id))));
}

function showDetail_ZH(id){
    let c = allCars.find(x=>x.id===id);
    if(!c) return;
    document.getElementById("modalTitle").innerHTML = `${c.brandCh} ${c.model} ${c.config}`;
    let exwD = c.exwUSD!==null ? `${c.exwUSD.toLocaleString()} $` : "-";
    let fobD = c.fobUSD!==null ? `${c.fobUSD.toLocaleString()} $` : "-";
    document.getElementById("modalDetails").innerHTML = `
        <div class="detail-field"><strong>颜色:</strong> ${c.colorCh === "-" ? "-" : c.colorCh}</div>
        <div class="detail-field"><strong>公里数:</strong> ${c.km.toLocaleString()} km</div>
        <div class="detail-field"><strong>动力类型:</strong> ${c.energyCh}</div>
        <div class="detail-field"><strong>EXW:</strong> ${exwD}</div>
        <div class="detail-field"><strong>FOB:</strong> ${fobD}</div>
    `;
    const wrapper = document.getElementById("swiperWrapper");
    wrapper.innerHTML = c.imgs.length ? c.imgs.map(u=>`<div class="swiper-slide"><img src="${u}"></div>`).join('') : `<div class="swiper-slide"><div style="height:300px;display:flex;align-items:center;justify-content:center;">暂无图片</div></div>`;
    if(swiperInstance) swiperInstance.destroy(true,true);
    swiperInstance = new Swiper('#detailSwiper', { navigation: { nextEl:'.swiper-button-next', prevEl:'.swiper-button-prev' }, loop: c.imgs.length>1 });
    document.getElementById("contactButtons").innerHTML = `
        <a href="mailto:${CONTACT.email}" class="contact-btn contact-mail"><i class="fas fa-envelope"></i> 邮箱</a>
        <a href="tel:${CONTACT.phone}" class="contact-btn contact-tel"><i class="fas fa-phone-alt"></i> 电话</a>
        <a href="https://wa.me/${CONTACT.whatsapp}" target="_blank" class="contact-btn contact-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <button class="contact-btn contact-wechat" id="wcCopy"><i class="fab fa-weixin"></i> 微信: ${CONTACT.wechat}</button>
    `;
    document.getElementById("wcCopy")?.addEventListener('click',()=>{ navigator.clipboard.writeText(CONTACT.wechat); alert(`微信: ${CONTACT.wechat} 已复制`); });
    document.getElementById("detailModal").style.display = "flex";
}

async function translateToLang(targetLang) {
    const cacheKey = `full_${targetLang}`;
    // 检查内存缓存
    if (translationCache[cacheKey]) {
        applyTranslatedUI(targetLang, translationCache[cacheKey]);
        return;
    }
    // 检查 localStorage 缓存
    const stored = localStorage.getItem(cacheKey);
    if (stored) {
        try {
            const cached = JSON.parse(stored);
            translationCache[cacheKey] = cached;
            applyTranslatedUI(targetLang, cached);
            return;
        } catch(e) {}
    }
    
    const grid = document.getElementById("carsGrid");
    const originalHTML = grid.innerHTML;
    grid.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i> 翻译中...<br><small style="font-size:0.7rem;">首次翻译需要几秒，之后秒开</small></div>`;
    
    try {
        const allBrands = [...new Set(allCars.map(c => c.brandCh))];
        const allEnergies = [...new Set(allCars.map(c => c.energyCh))];
        const allColors = [...new Set(allCars.map(c => c.colorCh).filter(c => c !== "-"))];
        const allModels = [...new Set(allCars.map(c => c.model).filter(m => m && m.trim()))];
        const allConfigs = [...new Set(allCars.map(c => c.config).filter(c => c && c.trim()))];
        const fixedEnergies = ["汽油", "柴油", "电动", "混动"];
        
        const [brandsMap, energiesMap, colorsMap, modelsMap, configsMap, fixedMap, uiMap, titleTrans] = await Promise.all([
            translateBatch(allBrands, targetLang),
            translateBatch(allEnergies, targetLang),
            translateBatch(allColors, targetLang),
            translateBatch(allModels, targetLang),
            translateBatch(allConfigs, targetLang),
            translateBatch(fixedEnergies, targetLang),
            translateBatch(["品牌", "价格 (USD)", "公里数", "动力类型", "重置", "没有找到符合条件的车辆", "全部", "邮箱", "电话", "📞 联系我们", "数据更新于", "颜色", "EXW", "FOB", "微信", "暂无图片", "联系询价"], targetLang),
            translateText("AutoChina Export", targetLang)
        ]);
        
        const translatedData = {
            brandsMap, energiesMap, colorsMap, modelsMap, configsMap, fixedMap, title: titleTrans,
            ui: {
                brand: uiMap["品牌"], price: uiMap["价格 (USD)"], mileage: uiMap["公里数"], energy: uiMap["动力类型"],
                reset: uiMap["重置"], noCars: uiMap["没有找到符合条件的车辆"], all: uiMap["全部"],
                email: uiMap["邮箱"], phone: uiMap["电话"], contactUs: uiMap["📞 联系我们"],
                updatePrefix: uiMap["数据更新于"], color: uiMap["颜色"], exw: uiMap["EXW"], fob: uiMap["FOB"],
                wechat: uiMap["微信"], noImage: uiMap["暂无图片"], contactPrice: uiMap["联系询价"]
            }
        };
        
        // 保存到内存和 localStorage
        translationCache[cacheKey] = translatedData;
        localStorage.setItem(cacheKey, JSON.stringify(translatedData));
        applyTranslatedUI(targetLang, translatedData);
    } catch(e) {
        console.error(e);
        grid.innerHTML = originalHTML;
        alert("翻译失败，请检查网络后重试");
    }
}

function applyTranslatedUI(targetLang, data) {
    const t = data.ui;
    document.title = data.title;
    document.getElementById("label-brand").innerText = t.brand;
    document.getElementById("label-price").innerText = t.price;
    document.getElementById("label-mileage").innerText = t.mileage;
    document.getElementById("label-energy").innerText = t.energy;
    document.getElementById("resetFilters").innerText = t.reset;
    document.getElementById("filterPrice").options[0].text = t.all;
    document.getElementById("filterMileage").options[0].text = t.all;
    
    const energySelect = document.getElementById("filterEnergy");
    energySelect.innerHTML = `<option value="all">${t.all}</option>
        <option value="汽油">${data.fixedMap["汽油"]}</option>
        <option value="柴油">${data.fixedMap["柴油"]}</option>
        <option value="电动">${data.fixedMap["电动"]}</option>
        <option value="混动">${data.fixedMap["混动"]}</option>`;
    if (currentFilter.energyType !== "all") energySelect.value = currentFilter.energyType;
    
    const brands = [...new Set(allCars.map(c => c.brandCh))];
    const brandSelect = document.getElementById("filterBrand");
    let opts = `<option value="all">${t.all}</option>`;
    brands.forEach(b => { opts += `<option value="${b}">${data.brandsMap[b] || b}</option>`; });
    brandSelect.innerHTML = opts;
    if (currentFilter.brand !== "all") brandSelect.value = currentFilter.brand;
    
    document.getElementById("contactTitle").innerText = t.contactUs;
    document.getElementById("homeContactButtons").innerHTML = `
        <a href="mailto:${CONTACT.email}" class="home-contact-btn home-mail"><i class="fas fa-envelope"></i> ${t.email}</a>
        <a href="tel:${CONTACT.phone}" class="home-contact-btn home-tel"><i class="fas fa-phone-alt"></i> ${t.phone}</a>
        <a href="https://wa.me/${CONTACT.whatsapp}" target="_blank" class="home-contact-btn home-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <button class="home-contact-btn home-wechat" id="homeWechatBtn"><i class="fab fa-weixin"></i> ${t.wechat}: ${CONTACT.wechat}</button>
    `;
    document.getElementById("homeWechatBtn")?.addEventListener('click', () => {
        navigator.clipboard.writeText(CONTACT.wechat);
        alert(`${t.wechat}: ${CONTACT.wechat} copied`);
    });
    
    document.getElementById("updateDate").innerText = `${t.updatePrefix} ${getYesterdayDate(targetLang)}`;
    renderCars_Translated(data);
}

function renderCars_Translated(data) {
    let filtered = allCars.filter(c=>{
        if(currentFilter.brand!=="all" && c.brandCh!==currentFilter.brand) return false;
        let price = (c.exwUSD!==null?c.exwUSD:(c.fobUSD!==null?c.fobUSD:0));
        if(currentFilter.priceRange!=="all"){ let [min,max]=currentFilter.priceRange.split("-").map(Number); if(price<min||price>max) return false; }
        if(currentFilter.mileageRange!=="all"){ let [min,max]=currentFilter.mileageRange.split("-").map(Number); if(c.km<min||c.km>max) return false; }
        if(currentFilter.energyType!=="all" && c.energyCh!==currentFilter.energyType) return false;
        return true;
    });
    const grid = document.getElementById("carsGrid");
    if(!filtered.length){ grid.innerHTML = `<div class="no-results">${data.ui.noCars}</div>`; return; }
    grid.innerHTML = filtered.map(c=>{
        let price = c.exwUSD!==null ? `${c.exwUSD.toLocaleString()} $` : (c.fobUSD!==null ? `${c.fobUSD.toLocaleString()} $` : data.ui.contactPrice);
        const brandTrans = data.brandsMap[c.brandCh] || c.brandCh;
        const modelTrans = data.modelsMap[c.model] || c.model;
        const configTrans = data.configsMap[c.config] || c.config;
        const titleParts = [brandTrans, modelTrans];
        if (configTrans && configTrans !== c.config) titleParts.push(configTrans);
        const titleText = titleParts.join(' ');
        const energyTrans = data.energiesMap[c.energyCh] || c.energyCh;
        const colorTrans = (c.colorCh === "-" ? "-" : (data.colorsMap[c.colorCh] || c.colorCh));
        return `<div class="car-card" data-id="${c.id}">
            <div class="car-image-area">${c.imgs[0]?`<img src="${c.imgs[0]}" onerror="this.parentElement.innerHTML='<i class=\'fas fa-car\'></i>'">`:'<i class="fas fa-car"></i>'}</div>
            <div class="car-info">
                <div class="car-title">${titleText}</div>
                <div><span class="badge">${energyTrans}</span> <span>${c.km.toLocaleString()} km</span></div>
                <div class="car-price">💰 ${price}</div>
                <div>🎨 ${colorTrans}</div>
            </div>
        </div>`;
    }).join('');
    document.querySelectorAll('.car-card').forEach(card=>card.addEventListener('click',()=>showDetail_Translated(parseInt(card.dataset.id), data)));
}

function showDetail_Translated(id, data){
    let c = allCars.find(x=>x.id===id);
    if(!c) return;
    const brandTrans = data.brandsMap[c.brandCh] || c.brandCh;
    const modelTrans = data.modelsMap[c.model] || c.model;
    const configTrans = data.configsMap[c.config] || c.config;
    const titleParts = [brandTrans, modelTrans];
    if (configTrans && configTrans !== c.config) titleParts.push(configTrans);
    document.getElementById("modalTitle").innerHTML = titleParts.join(' ');
    let exwD = c.exwUSD!==null ? `${c.exwUSD.toLocaleString()} $` : "-";
    let fobD = c.fobUSD!==null ? `${c.fobUSD.toLocaleString()} $` : "-";
    const energyTrans = data.energiesMap[c.energyCh] || c.energyCh;
    const colorTrans = (c.colorCh === "-" ? "-" : (data.colorsMap[c.colorCh] || c.colorCh));
    document.getElementById("modalDetails").innerHTML = `
        <div class="detail-field"><strong>${data.ui.color}:</strong> ${colorTrans}</div>
        <div class="detail-field"><strong>${data.ui.mileage}:</strong> ${c.km.toLocaleString()} km</div>
        <div class="detail-field"><strong>${data.ui.energy}:</strong> ${energyTrans}</div>
        <div class="detail-field"><strong>${data.ui.exw}:</strong> ${exwD}</div>
        <div class="detail-field"><strong>${data.ui.fob}:</strong> ${fobD}</div>
    `;
    const wrapper = document.getElementById("swiperWrapper");
    wrapper.innerHTML = c.imgs.length ? c.imgs.map(u=>`<div class="swiper-slide"><img src="${u}"></div>`).join('') : `<div class="swiper-slide"><div style="height:300px;display:flex;align-items:center;justify-content:center;">${data.ui.noImage}</div></div>`;
    if(swiperInstance) swiperInstance.destroy(true,true);
    swiperInstance = new Swiper('#detailSwiper', { navigation: { nextEl:'.swiper-button-next', prevEl:'.swiper-button-prev' }, loop: c.imgs.length>1 });
    document.getElementById("contactButtons").innerHTML = `
        <a href="mailto:${CONTACT.email}" class="contact-btn contact-mail"><i class="fas fa-envelope"></i> ${data.ui.email}</a>
        <a href="tel:${CONTACT.phone}" class="contact-btn contact-tel"><i class="fas fa-phone-alt"></i> ${data.ui.phone}</a>
        <a href="https://wa.me/${CONTACT.whatsapp}" target="_blank" class="contact-btn contact-wa"><i class="fab fa-whatsapp"></i> WhatsApp</a>
        <button class="contact-btn contact-wechat" id="wcCopy"><i class="fab fa-weixin"></i> ${data.ui.wechat}: ${CONTACT.wechat}</button>
    `;
    document.getElementById("wcCopy")?.addEventListener('click',()=>{ navigator.clipboard.writeText(CONTACT.wechat); alert(`${data.ui.wechat}: ${CONTACT.wechat} copied`); });
    document.getElementById("detailModal").style.display = "flex";
}

function applyFilters(){
    currentFilter = {
        brand: document.getElementById("filterBrand").value,
        priceRange: document.getElementById("filterPrice").value,
        mileageRange: document.getElementById("filterMileage").value,
        energyType: document.getElementById("filterEnergy").value
    };
    if (currentLang === "zh") renderCars_ZH();
    else { const cached = translationCache[`full_${currentLang}`]; if (cached) renderCars_Translated(cached); else translateToLang(currentLang); }
}
function resetFilters(){
    document.getElementById("filterBrand").value = "all";
    document.getElementById("filterPrice").value = "all";
    document.getElementById("filterMileage").value = "all";
    document.getElementById("filterEnergy").value = "all";
    applyFilters();
}
async function setLang(lang){
    if (lang === "zh") {
        currentLang = "zh";
        renderUI_ZH();
    } else {
        currentLang = lang;
        await translateToLang(lang);
    }
    document.querySelectorAll('.lang-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.lang===lang));
}

document.addEventListener("DOMContentLoaded",()=>{
    loadData();
    document.getElementById("filterBrand").addEventListener("change",applyFilters);
    document.getElementById("filterPrice").addEventListener("change",applyFilters);
    document.getElementById("filterMileage").addEventListener("change",applyFilters);
    document.getElementById("filterEnergy").addEventListener("change",applyFilters);
    document.getElementById("resetFilters").addEventListener("click",resetFilters);
    document.querySelector(".close-modal").onclick = ()=>document.getElementById("detailModal").style.display="none";
    window.onclick = (e)=>{ if(e.target===document.getElementById("detailModal")) document.getElementById("detailModal").style.display="none"; };
    document.querySelectorAll('.lang-btn').forEach(btn=>btn.addEventListener('click',()=>setLang(btn.dataset.lang)));
    setLang('zh');
});
</script>
</body>
</html>
